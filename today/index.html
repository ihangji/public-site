 const c=t.replace(/[^\u4e00-\u9fff]/g,' ');
 for(const r of c.split(/\s+/))for(let i=0;i<r.length;i++){o.add(r[i]);if(i+1<r.length)o.add(r.slice(i,i+2))}
 return [...o]}
if(q){q.oninput=()=>{const v=q.value.trim();
 if(!v){R.style.display='none';return}
 const ts=tok(v),sc=IDX.map(p=>{let s=0;for(const t of ts)if(p.k.includes(t))s++;
  if(p.t.toLowerCase().includes(v.toLowerCase()))s+=12;
  if((p.s||'').toLowerCase().includes(v.toLowerCase()))s+=5;return {p,s}})
  .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,12);
 R.innerHTML=sc.length?sc.map(x=>'<a href="'+BASE+'learn/'+x.p.u+'/"><b>'+x.p.t+'</b><small>'+(x.p.s||'')+'</small></a>').join('')
   :'<a><small>没有找到「'+v.replace(/</g,'&lt;')+'」</small></a>';
 R.style.display='block'};
 q.onblur=()=>setTimeout(()=>R.style.display='none',180);
 q.onfocus=()=>{if(q.value.trim())R.style.display='block'};
 document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}});
}</script></body></html>
