<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="知识指南 - 系统化学习笔记，随时随地查阅">
  <meta name="theme-color" content="#2563eb">
  <title>知识指南</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 顶部导航 -->
  <header class="header">
    <div class="header-left">
      <button class="header-btn menu-toggle" id="menu-toggle" aria-label="切换导航菜单">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <a href="#" class="header-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          <line x1="12" y1="6" x2="16" y2="6"/>
          <line x1="12" y1="10" x2="16" y2="10"/>
          <line x1="12" y1="14" x2="14" y2="14"/>
        </svg>
        <span id="site-title">知识指南</span>
      </a>
    </div>
    <div class="header-right">
      <button class="header-btn" id="theme-toggle" aria-label="切换深色/浅色模式">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 主布局 -->
  <div class="app-layout">
    <!-- 左侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-title">目录导航</div>
      <nav id="sidebar-nav" aria-label="目录导航"></nav>
    </aside>

    <!-- 遮罩层（移动端） -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- 主内容区 -->
    <main class="main-content" id="main-content"></main>
  </div>

  <!-- 返回顶部 -->
  <button class="back-to-top" id="back-to-top" aria-label="返回顶部">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>

  <!-- 脚本 -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
